name: Update calculator data

on:
  schedule:
    # 2nd of each month catches 1 July stamp duty changes; 10th catches the RBA's
    # monthly rate release (published in the first week).
    - cron: "0 0 2 * *"
    - cron: "0 0 10 * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # If either check fails the job fails, nothing is committed, and GitHub emails you.
      - name: Stamp duty rates
        run: python scripts/update_stamp_duty.py
      - name: RBA mortgage rate
        run: python scripts/update_rates.py
      # Always commits (the "checked" date changes), which also stops GitHub pausing
      # this schedule after 60 days without repo activity.
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update calculator data"
          git push
